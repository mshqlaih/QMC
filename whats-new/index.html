<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ما الجديد — تطبيق الصفوة لمتابعة الحلقات القرآنية</title>
<meta name="description" content="ما أُضيف وأُصلح في كل إصدار من تطبيق الصفوة لمتابعة الحلقات القرآنية">
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" rel="stylesheet">
<!--
  صفحة «ما الجديد» — تقرأ releases.json بجانبها (يكتبه release.ps1 من release/whats_new.md).

  المعاملات في الـ hash (لا تصل إلى أيّ خادم):
    #v=1.2.13            الإصدار المعروض (الافتراضي: أحدثها)
    &item=1.2.13-3       بندٌ يُفتح ويُمرَّر إليه
    &hide=1.2.13-2,...   بنودٌ لا تخصّ المستخدم (يحسبها التطبيق من صلاحياته)
  بلا hide تُعرض البنود كلّها (رابط ملاحظات GitHub مثلًا).
  ⚠️ يُفتح من التطبيق بـ whats-new/index.html صريحًا (خادم flutter run لا يفتح فهرس المجلّد).
-->
<style>
  /* ألوان الشعار: أخضر داكن + ذهبيّ */
  :root {
    --bg: #f5f4ef;
    --surface: #ffffff;
    --surface-2: #f7f6f1;
    --border: #e6e3d8;
    --text: #1c2622;
    --muted: #5d6a64;
    --green: #134a3f;
    --green-2: #1d6b5a;
    --gold: #b8901c;
    --gold-soft: #f6efd9;
    --new: #1d6b5a;     --new-bg: #e4f1ec;
    --improve: #2f56b8; --improve-bg: #e8eefb;
    --fix: #a8561a;     --fix-bg: #fbeee2;
    --shadow: 0 1px 2px rgba(28, 38, 34, .04), 0 6px 20px rgba(28, 38, 34, .06);
    --shadow-up: 0 10px 30px rgba(19, 74, 63, .16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1412; --surface: #161e1b; --surface-2: #1b2521; --border: #2a3632;
      --text: #e7ece9; --muted: #9babA4; --green: #0f2f29; --green-2: #17493f;
      --gold: #e2c15e; --gold-soft: #3a3218;
      --new: #6fd3b5; --new-bg: #173a32; --improve: #9db8fb; --improve-bg: #1d2a47;
      --fix: #f2b27a; --fix-bg: #3a2817; --shadow: none; --shadow-up: 0 10px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1412; --surface: #161e1b; --surface-2: #1b2521; --border: #2a3632;
    --text: #e7ece9; --muted: #9baba4; --green: #0f2f29; --green-2: #17493f;
    --gold: #e2c15e; --gold-soft: #3a3218;
    --new: #6fd3b5; --new-bg: #173a32; --improve: #9db8fb; --improve-bg: #1d2a47;
    --fix: #f2b27a; --fix-bg: #3a2817; --shadow: none; --shadow-up: 0 10px 30px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    font-size: 16px;
    line-height: 1.8;
  }
  .wrap { max-width: 780px; margin-inline: auto; padding-inline: 16px; }

  /* ── الرأس ── */
  header.hero {
    position: relative;
    overflow: hidden;
    color: #fff;
    background:
      radial-gradient(600px 260px at 12% 0%, rgba(226, 193, 94, .22), transparent 70%),
      radial-gradient(500px 300px at 100% 100%, rgba(255, 255, 255, .06), transparent 70%),
      linear-gradient(160deg, var(--green-2), var(--green));
    padding: 30px 0 78px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img {
    width: 52px; height: 52px; flex: none;
    background: #fff; border-radius: 14px; padding: 5px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
  }
  .brand .app { font-weight: 600; font-size: 15.5px; line-height: 1.5; }
  .brand .app small { display: block; font-weight: 400; opacity: .78; font-size: 13px; }
  .hero h1 {
    font-family: "Noto Kufi Arabic", "IBM Plex Sans Arabic", sans-serif;
    margin: 26px 0 10px; font-size: 34px; line-height: 1.4; font-weight: 700;
  }
  .hero .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 14.5px; }
  .ver {
    background: var(--gold); color: #1c1606; font-weight: 700;
    border-radius: 999px; padding: 2px 14px;
  }
  :root[data-theme="dark"] .ver { color: #1c1606; }
  .hero .meta .dot { opacity: .5; }

  /* ── شريط المرشّحات (يعلو الرأس) ── */
  main { padding-bottom: 40px; }
  .toolbar {
    margin-top: -46px; position: relative;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; box-shadow: var(--shadow-up);
    padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 18px;
  }
  .chip {
    font: inherit; font-size: 14.5px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    border-radius: 999px; padding: 5px 14px 5px 10px;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip b {
    min-width: 26px; text-align: center; font-size: 13px; border-radius: 999px;
    padding: 0 7px; background: var(--surface); border: 1px solid var(--border);
  }
  .chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
  .chip[aria-pressed="true"] b { background: rgba(255,255,255,.18); border-color: transparent; color: #fff; }
  .chip:focus-visible, .toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .chip .sw { width: 9px; height: 9px; border-radius: 50%; }
  .toggle {
    font: inherit; font-size: 14px; cursor: pointer; margin-inline-start: auto;
    background: none; border: none; color: var(--green-2); padding: 5px 8px; border-radius: 8px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toggle { color: var(--gold); } }
  :root[data-theme="dark"] .toggle { color: var(--gold); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .chip[aria-pressed="true"] { background: var(--green-2); border-color: var(--green-2); }
  }
  :root[data-theme="dark"] .chip[aria-pressed="true"] { background: var(--green-2); border-color: var(--green-2); }

  /* ── البطاقات ── */
  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
    scroll-margin-top: 20px;
    transition: box-shadow .2s, border-color .2s;
  }
  .card::before {
    content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 4px;
    background: var(--k);
  }
  .card.new { --k: var(--new); --kbg: var(--new-bg); }
  .card.improve { --k: var(--improve); --kbg: var(--improve-bg); }
  .card.fix { --k: var(--fix); --kbg: var(--fix-bg); }
  .card:hover { border-color: color-mix(in srgb, var(--k) 35%, var(--border)); }
  .card.target { animation: glow 2.4s ease-out 1; border-color: var(--gold); }
  @keyframes glow {
    0%, 30% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 45%, transparent); }
    100% { box-shadow: var(--shadow); }
  }

  .card > button {
    all: unset; box-sizing: border-box; cursor: pointer;
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start;
    width: 100%; padding: 18px 20px 18px 16px;
  }
  .card > button:focus-visible { outline: 2px solid var(--gold); outline-offset: -3px; border-radius: 16px; }
  .icon {
    width: 46px; height: 46px; border-radius: 13px;
    display: grid; place-items: center; font-size: 22px;
    background: var(--kbg);
  }
  .head { min-width: 0; }
  .badge {
    display: inline-block; font-size: 12px; font-weight: 600; line-height: 1.9;
    color: var(--k); background: var(--kbg); border-radius: 6px; padding: 0 8px;
  }
  .head h3 { margin: 4px 0 0; font-size: 18px; line-height: 1.6; font-weight: 700; }
  .head p { margin: 2px 0 0; color: var(--muted); font-size: 15px; line-height: 1.75; }
  .chev {
    width: 32px; height: 32px; border-radius: 50%; margin-top: 6px;
    display: grid; place-items: center; color: var(--muted); background: var(--surface-2);
    transition: transform .25s ease, background .15s;
  }
  .card.open .chev { transform: rotate(180deg); background: var(--kbg); color: var(--k); }

  /* التفاصيل تنفتح بانسياب (grid-template-rows 0fr ⇐ 1fr) */
  .details { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; }
  .card.open .details { grid-template-rows: 1fr; }
  .details > div { overflow: hidden; }
  .details .in {
    margin: 0 20px 18px; margin-inline-start: 76px;
    padding-top: 12px; border-top: 1px dashed var(--border);
  }
  .details p { margin: 8px 0 0; }
  .details ul { margin: 8px 0 0; padding: 0; list-style: none; }
  .details li { position: relative; margin: 6px 0; padding-inline-start: 20px; }
  .details li::before {
    content: ""; position: absolute; inset-inline-start: 4px; top: .78em;
    width: 7px; height: 7px; border-radius: 50%; background: var(--k);
  }
  .where {
    display: flex; gap: 8px; align-items: flex-start;
    margin-top: 14px; padding: 9px 12px; border-radius: 10px;
    background: var(--gold-soft); font-size: 14.5px;
  }
  .where svg { flex: none; margin-top: 4px; color: var(--gold); }

  /* ── الإصدارات الأخرى ── */
  h2.section {
    font-family: "Noto Kufi Arabic", "IBM Plex Sans Arabic", sans-serif;
    font-size: 17px; margin: 34px 0 12px;
  }
  .older { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .older a {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 16px; color: var(--text); text-decoration: none;
  }
  .older a:hover { border-color: var(--gold); }
  .older small { color: var(--muted); }

  .empty, .error {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 30px 20px; text-align: center; color: var(--muted);
  }
  footer { color: var(--muted); font-size: 13.5px; text-align: center; padding: 6px 16px 34px; }
  footer img { width: 28px; height: 28px; vertical-align: middle; margin-inline-end: 6px; opacity: .9; }
  footer a { color: var(--green-2); }

  @media (max-width: 560px) {
    header.hero { padding: 22px 0 70px; }
    .hero h1 { font-size: 26px; margin-top: 20px; }
    .brand img { width: 44px; height: 44px; }
    .card > button { gap: 12px; padding: 16px 14px 16px 12px; }
    .icon { width: 40px; height: 40px; font-size: 19px; }
    .head h3 { font-size: 16.5px; }
    .head p { font-size: 14.5px; }
    .details .in { margin-inline: 14px 16px; }
    .toolbar { padding: 10px; gap: 6px; }
    .chip { font-size: 13.5px; gap: 6px; padding: 4px 10px 4px 7px; }
    .chip b { min-width: 22px; padding: 0 5px; font-size: 12.5px; }
    .chip .sw { display: none; }
    .toggle { margin-inline-start: 0; font-size: 13.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { transition: none !important; animation: none !important; }
  }
  @media print {
    header.hero { background: none; color: var(--text); padding: 0 0 10px; }
    .brand img { box-shadow: none; }
    .toolbar, .chev, #history, footer a { display: none; }
    .details { grid-template-rows: 1fr !important; }
    .card { break-inside: avoid; box-shadow: none; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="brand">
      <img src="../icons/Icon-192.png" alt="">
      <div class="app">تطبيق الصفوة لمتابعة الحلقات القرآنية<small>ملاحظات الإصدار</small></div>
    </div>
    <h1>ما الجديد</h1>
    <div class="meta" id="meta"></div>
  </div>
</header>

<main class="wrap">
  <div class="toolbar" id="toolbar" hidden></div>
  <div id="content"><div class="empty">جارٍ التحميل…</div></div>
  <div id="history"></div>
</main>

<footer>
  <img src="../icons/Icon-192.png" alt="">
  تطبيق الصفوة لمتابعة الحلقات القرآنية ·
  <a href="https://github.com/mshqlaih/QMC/releases" target="_blank" rel="noopener">كل الإصدارات</a>
</footer>

<script>
(function () {
  var KINDS = {
    new:     { label: 'جديد',  icon: '✨' },
    improve: { label: 'تحسين', icon: '🛠️' },
    fix:     { label: 'إصلاح', icon: '🩹' }
  };
  var PIN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
  var CHEV = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

  var data = null, filter = 'all';

  function params() {
    var out = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('=');
      var k = i < 0 ? kv : kv.slice(0, i);
      var v = i < 0 ? '' : kv.slice(i + 1);
      try { out[k] = decodeURIComponent(v); } catch (e) { out[k] = v; }
    });
    return out;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Markdown خفيف: **عريض** فقط — يُهرَّب النصّ أوّلًا.
  function inline(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  // التفاصيل أسطر: «- » نقطة، و«📍 » موضع الشاشة، وغيرها فقرة.
  function detailsHtml(lines) {
    var html = '', list = false;
    (lines || []).forEach(function (l) {
      var t = String(l).trim();
      if (!t) return;
      if (/^[-•*]\s+/.test(t)) {
        if (!list) { html += '<ul>'; list = true; }
        html += '<li>' + inline(t.replace(/^[-•*]\s+/, '')) + '</li>';
        return;
      }
      if (list) { html += '</ul>'; list = false; }
      if (/^📍/.test(t)) html += '<div class="where">' + PIN + '<span>' + inline(t.replace(/^📍\s*/, '')) + '</span></div>';
      else html += '<p>' + inline(t) + '</p>';
    });
    if (list) html += '</ul>';
    return html;
  }

  function fmtDate(d) {
    if (!d) return '';
    try {
      return new Date(d + 'T12:00:00').toLocaleDateString('ar-EG-u-nu-latn', {
        year: 'numeric', month: 'long', day: 'numeric'
      });
    } catch (e) { return d; }
  }

  function kindOf(it) { return KINDS[it.kind] ? it.kind : 'new'; }

  function cardHtml(it, open) {
    var kind = kindOf(it), k = KINDS[kind];
    var has = it.details && it.details.length;
    return '<article class="card ' + kind + (open && has ? ' open' : '') + '" id="i-' + esc(it.id) + '" data-kind="' + kind + '">' +
      '<button type="button"' + (has ? ' aria-expanded="' + (open ? 'true' : 'false') + '"' : ' tabindex="-1"') + '>' +
        '<span class="icon" aria-hidden="true">' + (it.icon ? esc(it.icon) : k.icon) + '</span>' +
        '<span class="head">' +
          '<span class="badge">' + k.label + '</span>' +
          '<h3>' + inline(it.title) + '</h3>' +
          (it.summary ? '<p>' + inline(it.summary) + '</p>' : '') +
        '</span>' +
        (has ? '<span class="chev">' + CHEV + '</span>' : '<span></span>') +
      '</button>' +
      (has ? '<div class="details"><div><div class="in">' + detailsHtml(it.details) + '</div></div></div>' : '') +
      '</article>';
  }

  function render() {
    var p = params();
    var hide = {};
    (p.hide || '').split(',').forEach(function (id) { if (id) hide[id] = 1; });
    var releases = (data.releases || []).map(function (r) {
      return { version: r.version, date: r.date,
               items: (r.items || []).filter(function (it) { return !hide[it.id]; }) };
    });
    var content = document.getElementById('content');
    var bar = document.getElementById('toolbar');
    if (!releases.length) {
      content.innerHTML = '<div class="empty">لا توجد ملاحظات إصدار بعد.</div>';
      return;
    }

    var cur = releases.filter(function (r) { return r.version === p.v; })[0] || releases[0];
    document.title = 'ما الجديد في الإصدار ' + cur.version + ' — تطبيق الصفوة لمتابعة الحلقات القرآنية';
    document.getElementById('meta').innerHTML =
      '<span class="ver">الإصدار ' + esc(cur.version) + '</span>' +
      (cur.date ? '<span>' + esc(fmtDate(cur.date)) + '</span><span class="dot">•</span>' : '') +
      '<span>' + cur.items.length + ' ' + (cur.items.length === 1 ? 'تحديثٌ يخصّك' : 'تحديثات تخصّك') + '</span>';

    if (!cur.items.length) {
      bar.hidden = true;
      content.innerHTML = '<div class="empty">لا شيء في هذا الإصدار يخصّ شاشاتك — تحسيناتٌ داخلية فقط.</div>';
    } else {
      var c = { new: 0, improve: 0, fix: 0 };
      cur.items.forEach(function (it) { c[kindOf(it)]++; });
      var chips = [['all', 'الكل', cur.items.length, '']].concat(
        ['new', 'improve', 'fix'].filter(function (k) { return c[k]; })
          .map(function (k) { return [k, KINDS[k].label, c[k], 'var(--' + k + ')']; }));
      bar.hidden = false;
      bar.innerHTML = chips.map(function (x) {
        return '<button type="button" class="chip" data-f="' + x[0] + '" aria-pressed="' + (filter === x[0]) + '">' +
          (x[3] ? '<span class="sw" style="background:' + x[3] + '"></span>' : '') +
          x[1] + ' <b>' + x[2] + '</b></button>';
      }).join('') + '<button type="button" class="toggle" id="toggleAll">فتح التفاصيل كلّها</button>';
      content.innerHTML = cur.items.map(function (it) { return cardHtml(it, it.id === p.item); }).join('');
      applyFilter();
    }

    var older = releases.filter(function (r) { return r !== cur && r.items.length; });
    document.getElementById('history').innerHTML = older.length
      ? '<h2 class="section">إصدارات أخرى</h2><div class="older">' +
        older.map(function (r) {
          var h = '#v=' + encodeURIComponent(r.version) + (p.hide ? '&hide=' + encodeURIComponent(p.hide) : '');
          return '<a href="' + h + '"><span><b>الإصدار ' + esc(r.version) + '</b> · ' +
            r.items.length + ' تحديثات</span><small>' + esc(fmtDate(r.date)) + '</small></a>';
        }).join('') + '</div>'
      : '';

    if (p.item) {
      var el = document.getElementById('i-' + p.item);
      if (el) {
        el.classList.add('target');
        setTimeout(function () { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80);
      }
    } else {
      window.scrollTo(0, 0);
    }
  }

  function applyFilter() {
    document.querySelectorAll('.card').forEach(function (c) {
      c.hidden = filter !== 'all' && c.getAttribute('data-kind') !== filter;
    });
    document.querySelectorAll('.chip').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-f') === filter));
    });
    syncToggle();
  }

  function setOpen(card, open) {
    if (!card.querySelector('.details')) return;
    card.classList.toggle('open', open);
    card.querySelector('button').setAttribute('aria-expanded', String(open));
  }

  function visibleCards() {
    return Array.prototype.filter.call(document.querySelectorAll('.card'), function (c) {
      return !c.hidden && c.querySelector('.details');
    });
  }

  function syncToggle() {
    var t = document.getElementById('toggleAll');
    if (!t) return;
    var cards = visibleCards();
    t.hidden = !cards.length;
    var allOpen = cards.length && cards.every(function (c) { return c.classList.contains('open'); });
    t.textContent = allOpen ? 'طيّ التفاصيل' : 'فتح التفاصيل كلّها';
  }

  // تفويضٌ واحد للنقرات — يبقى بعد إعادة الرسم
  document.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (chip) { filter = chip.getAttribute('data-f'); applyFilter(); return; }
    if (e.target.closest('#toggleAll')) {
      var cards = visibleCards();
      var open = !cards.every(function (c) { return c.classList.contains('open'); });
      cards.forEach(function (c) { setOpen(c, open); });
      syncToggle();
      return;
    }
    var btn = e.target.closest('.card > button');
    if (btn) {
      var card = btn.parentNode;
      setOpen(card, !card.classList.contains('open'));
      syncToggle();
    }
  });

  function load() {
    // ?t= يتخطّى كاش GitHub Pages (10 دقائق) — الملف صغير
    fetch('releases.json?t=' + Math.floor(Date.now() / 60000), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { data = d; render(); })
      .catch(function () {
        document.getElementById('content').innerHTML =
          '<div class="error">تعذّر تحميل ملاحظات الإصدار. تأكّد من الاتصال ثم أعد فتح الصفحة.</div>';
      });
  }
  window.addEventListener('hashchange', function () { if (data) { filter = 'all'; render(); } });
  load();
})();
</script>
</body>
</html>
